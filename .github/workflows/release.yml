name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Opt JavaScript actions (checkout, upload-artifact, action-gh-release)
  # into Node.js 24 ahead of the June 2026 default switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.dmg.outputs.sha256 }}

    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          ls /Applications | grep -i '^Xcode' || true

      - name: Select latest Xcode 26
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=/Applications/Xcode.app
          fi
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install Metal Toolchain
        # Xcode 26 ships the Metal compiler as an on-demand component that
        # isn't present on the runner image by default.
        run: sudo xcodebuild -downloadComponent MetalToolchain

      - name: Derive version
        id: version
        run: |
          REF="${GITHUB_REF_NAME}"
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="${REF#v}"
          else
            # Non-tag run (workflow_dispatch): mark as dev build.
            SHORT_SHA="${GITHUB_SHA:0:7}"
            REF="dev-${SHORT_SHA}"
            VERSION="0.0.0-${SHORT_SHA}"
          fi
          echo "ref=$REF"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build (Release, ad-hoc signed)
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme Bubilator88 \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            build

      - name: Locate .app
        id: locate
        run: |
          APP_PATH="build/Build/Products/Release/Bubilator88.app"
          test -d "$APP_PATH"
          echo "app=$APP_PATH" >> "$GITHUB_OUTPUT"
          du -sh "$APP_PATH"

      - name: Ad-hoc re-sign (deep)
        run: |
          codesign --force --deep --sign - "${{ steps.locate.outputs.app }}"
          codesign --verify --verbose=2 "${{ steps.locate.outputs.app }}"

      - name: Create DMG with /Applications symlink
        id: dmg
        run: |
          set -euo pipefail
          STAGE="dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "${{ steps.locate.outputs.app }}" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          DMG_NAME="Bubilator88-${{ steps.version.outputs.ref }}.dmg"
          hdiutil create \
            -volname "Bubilator88" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDZO \
            "$DMG_NAME"

          du -sh "$DMG_NAME"
          echo "name=$DMG_NAME" >> "$GITHUB_OUTPUT"

          SHA256=$(shasum -a 256 "$DMG_NAME" | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (for workflow_dispatch runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: ${{ steps.dmg.outputs.name }}
          retention-days: 14

      - name: Attach DMG to Release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.dmg.outputs.name }}
          tag_name: ${{ steps.version.outputs.ref }}
          draft: false
          prerelease: false
          generate_release_notes: false

  # Bump the Homebrew cask in bubio/homebrew-bubilator88 to the freshly
  # released version + DMG checksum. Only runs for real published releases
  # (not workflow_dispatch dev builds). Requires a HOMEBREW_TAP_TOKEN secret
  # with contents:write on the tap repo.
  update-tap:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: bubio/homebrew-bubilator88
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Bump cask
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          CASK="Casks/bubilator88.rb"
          test -n "$VERSION"
          test -n "$SHA256"
          sed -i -E "s|^  version \".*\"|  version \"${VERSION}\"|" "$CASK"
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"${SHA256}\"|" "$CASK"
          echo "--- updated cask ---"
          grep -E "^  (version|sha256) " "$CASK"

      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Cask already up to date; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "bubilator88 ${{ needs.build.outputs.version }}"
          git push
