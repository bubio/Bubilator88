name: "CodeQL"

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

  schedule:
    - cron: '15 15 * * 3'

permissions:
  security-events: write
  contents: read
  actions: read
  packages: read

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode 26
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)

          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=/Applications/Xcode.app
          fi

          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

          # Pin DEVELOPER_DIR for all later steps (including the CodeQL build).
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

          xcodebuild -version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift

      - name: Build
        # CodeQL only needs to trace the Swift compilation. Under CodeQL's
        # build tracer (DYLD_INSERT_LIBRARIES) the Xcode 26 Metal toolchain
        # lookup breaks, so `metal` fails — even though a plain build works
        # fine (see release.yml). Since the shaders are irrelevant to Swift
        # analysis, exclude all *.metal sources so no CompileMetalFile task is
        # generated and `metal` is never invoked. The Metal library is loaded
        # by name at runtime, not linked, so the build still succeeds.
        run: |
          xcodebuild \
            -scheme Bubilator88 \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            EXCLUDED_SOURCE_FILE_NAMES='*.metal' \
            build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
