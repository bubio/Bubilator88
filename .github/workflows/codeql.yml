name: "CodeQL"

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

  schedule:
    - cron: '15 15 * * 3'

permissions:
  security-events: write
  contents: read
  actions: read
  packages: read

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode 26
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)

          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=/Applications/Xcode.app
          fi

          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

          xcodebuild -version

      - name: Install Metal Toolchain
        # Xcode 26 ships the Metal compiler as an on-demand component. A plain
        # download is enough for a normal build (see release.yml). But under
        # CodeQL's build tracer the on-demand mount of the toolchain cryptex
        # fails, so the traced build reports "missing Metal Toolchain". We
        # therefore download AND mount the cryptex persistently *before* the
        # CodeQL-traced build runs.
        run: |
          set -x
          sudo xcodebuild -downloadComponent MetalToolchain

          if [ ! -d /Volumes/MetalToolchainCryptex ]; then
            open /System/Library/AssetsV2/com_apple_MobileAsset_MetalToolchain/*.asset/AssetData/Restore/*.dmg
            for i in $(seq 1 30); do
              [ -d /Volumes/MetalToolchainCryptex ] && break
              sleep 2
            done
          fi
          # Should report "Toolchain Search Path: /Volumes/MetalToolchainCryptex".
          xcodebuild -showComponent metalToolchain || true

          # Verify by actually compiling a trivial shader (NOT `metal --version`,
          # which succeeds even when the compile backend is missing).
          cat > /tmp/probe.metal <<'EOF'
          #include <metal_stdlib>
          using namespace metal;
          kernel void probe() {}
          EOF
          xcrun metal -c /tmp/probe.metal -o /tmp/probe.air
          echo "Metal toolchain verified: compiled probe.metal successfully"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift

      - name: Build
        run: |
          xcodebuild \
            -scheme Bubilator88 \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
