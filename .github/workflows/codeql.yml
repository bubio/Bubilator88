name: "CodeQL"

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

  schedule:
    - cron: '15 15 * * 3'

permissions:
  security-events: write
  contents: read
  actions: read
  packages: read

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode 26
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)

          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=/Applications/Xcode.app
          fi

          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

          xcodebuild -version

      - name: Install Metal Toolchain
        run: |
          set -x
          echo "Active developer dir: $(xcode-select -p)"

          # The Metal toolchain is no longer bundled in Xcode 26+. On the
          # macos-26 image the asset is already INSTALLED (downloadComponent
          # reports "already installed"), and `xcrun metal -c` works on demand,
          # but `xcodebuild build` still fails with "missing Metal Toolchain"
          # because the toolchain *cryptex DMG is not mounted*. Mounting it at
          # /Volumes/MetalToolchainCryptex is what makes the build find it.

          # Best-effort install (idempotent — tolerate "already installed").
          for i in 1 2 3; do
            xcodebuild -downloadComponent metalToolchain \
              -exportPath /tmp/metalToolchainDownload/ && break
            echo "downloadComponent attempt $i failed; retrying in 20s"
            sleep 20
          done
          xcodebuild -importComponent metalToolchain \
            -importPath /tmp/metalToolchainDownload/*.exportedBundle || true

          # Mount the toolchain cryptex so the build system can locate it.
          if [ ! -d /Volumes/MetalToolchainCryptex ]; then
            open /System/Library/AssetsV2/com_apple_MobileAsset_MetalToolchain/*.asset/AssetData/Restore/*.dmg
            for i in $(seq 1 30); do
              [ -d /Volumes/MetalToolchainCryptex ] && break
              sleep 2
            done
          fi
          # Show where the build will look for the toolchain (should report a
          # "Toolchain Search Path: /Volumes/MetalToolchainCryptex").
          xcodebuild -showComponent metalToolchain || true

          # Verify by actually compiling a trivial shader (NOT `metal --version`,
          # which succeeds even when the compile backend is missing).
          cat > /tmp/probe.metal <<'EOF'
          #include <metal_stdlib>
          using namespace metal;
          kernel void probe() {}
          EOF
          xcrun metal -c /tmp/probe.metal -o /tmp/probe.air
          echo "Metal toolchain verified: compiled probe.metal successfully"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift

      - name: Build
        run: |
          xcodebuild \
            -scheme Bubilator88 \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
